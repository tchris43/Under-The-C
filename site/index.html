<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Piano note-reading games with the Note Friends.">
<title>Under the C</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="home.css">
<script type="module" src="home.js"></script>
</head>
<body>
<main class="app">
  <header class="hero">
    <svg class="hero-art" viewBox="-44 -44 88 88" aria-hidden="true" data-char="coco"></svg>
    <div>
      <h1>Under the C</h1>
      <p>Piano note games with the Note Friends</p>
    </div>
  </header>

  <nav class="games" aria-label="Games">
    <a class="game" href="under-the-sea/" style="--c:#5FB8C9">
      <span class="art" aria-hidden="true"><svg viewBox="-44 -44 88 88" data-char="daisy"></svg><svg viewBox="-44 -44 88 88" data-char="charlie"></svg><svg viewBox="-44 -44 88 88" data-char="gracie"></svg></span>
      <span class="chip">Meet the friends</span>
      <span class="name">Under the Sea</span>
      <span class="line">Tap each friend to hear its note and see where it lives.</span>
    </a>
    <a class="game" href="who-lives-here/" style="--c:#F5A31A">
      <span class="art" aria-hidden="true"><svg viewBox="-44 -44 88 88" data-char="goldie"></svg><svg viewBox="-44 -44 88 88" data-char="annie"></svg><svg viewBox="-44 -44 88 88" data-char="ellie"></svg></span>
      <span class="chip">Levels 1 and 2</span>
      <span class="name">Who Lives Here?</span>
      <span class="line">Find the friend on the note, then spot steps and skips.</span>
    </a>
    <a class="game" href="note-flash/" style="--c:#9B6BE0">
      <span class="art" aria-hidden="true"><svg viewBox="-44 -44 88 88" data-char="benny"></svg><svg viewBox="-44 -44 88 88" data-char="eddie"></svg><svg viewBox="-44 -44 88 88" data-char="flossy"></svg></span>
      <span class="chip">Level 3</span>
      <span class="name">Note Flash</span>
      <span class="line">Name the note with letters or on the piano keys.</span>
    </a>
  </nav>
</main>
</body>
</html>
