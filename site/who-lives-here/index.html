<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Who Lives Here? · Under the C</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#2F86B9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Under the C">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="../kit/kit.css">
<link rel="stylesheet" href="style.css">
<script type="module" src="main.js"></script>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <a class="btn home" href="../" aria-label="All games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Games</a>
      <div><h1>Who Lives Here?</h1><p id="tagline">Find the friend who lives on the note</p></div>
    </div>
  </header>

<section class="setup" id="setup" aria-label="Set up practice" hidden></section>

  <div class="game" id="game" hidden>
    <div class="progress" aria-label="Progress">
      <span class="count" id="count">1 / 10</span>
      <div class="slots" id="slots"></div>
    </div>

    <section class="stage" id="stage">
      <div class="sheet">
        <svg class="staff" id="staff" viewBox="0 80 600 470" role="img" aria-label="Notes on the staff"></svg>
        <div class="ask" id="ask" aria-live="polite">Who lives here?</div>
        <button type="button" class="btn hear" id="hearBtn" aria-label="Hear the notes"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 17.5a3 3 0 1 1-2-2.83V5.5l12-2.5v11.5a3 3 0 1 1-2-2.83V6.9L9 8.6v8.9z"/></svg><span>Hear it</span></button>
      </div>
      <div class="finish" id="finish" hidden>
        <h2>You did it!</h2>
        <div class="row" id="finishRow"></div>
        <p id="finishMsg"></p>
        <div class="finish-btns">
          <button type="button" class="btn" id="againBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4.5h4.5"/></svg>Play again</button>
          <button type="button" class="btn soft" id="changeBtn">Change settings</button>
        </div>
      </div>
    </section>

    <section class="choices" id="choices" aria-label="Pick an answer"></section>
    <p class="kbtip">Laptop: press <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> to pick a card, <kbd>H</kbd> to hear the notes.</p>
  </div>
</main>
</body>
</html>
